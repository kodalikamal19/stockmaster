version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stockmaster_db
    environment:
      POSTGRES_USER: ${DB_USER:-stockmaster}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockmaster123}
      POSTGRES_DB: ${DB_NAME:-stockmaster}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockmaster}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stockmaster_api
    command: gunicorn -w 4 -b 0.0.0.0:5000 --timeout 120 "app:create_app()"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-stockmaster}:${DB_PASSWORD:-stockmaster123}@postgres:5432/${DB_NAME:-stockmaster}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-3600}
      JWT_REFRESH_TOKEN_EXPIRES: ${JWT_REFRESH_TOKEN_EXPIRES:-2592000}
      OTP_SECRET_KEY: ${OTP_SECRET_KEY:-your-otp-secret-key}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: stockmaster_web
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

